[project]
name = "planner-exec"
version = "0.5.0"
description = "MCP server: premium agent plans, cheap LLM executes phase DAGs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mcp>=2.0",
  "pydantic-ai-slim[openai]>=1.0",
]

[project.scripts]
planner-exec-mcp = "planner_exec.server:main"
planner-exec = "planner_exec.pe:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["planner_exec"]
